server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The SPA and the API share an origin, so the browser never needs CORS and
  # the refresh-token cookie stays first-party.
  location /api/ {
    proxy_pass http://api:4001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.IO needs the WebSocket upgrade headers.
  location /socket.io/ {
    proxy_pass http://api:4001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Client-side routing: unknown paths are handled by the React router.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
}
